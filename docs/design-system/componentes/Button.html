<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>Button — PET Lock</title><link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../petlock.css"><style></style></head>
<body>
<div class="pl-demo col" style="gap:16px">
<div class="pl-row">
  <button class="pl-btn pl-btn-primary"><svg class="pl-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg>Cadastrar membro</button>
  <button class="pl-btn"><svg class="pl-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>Exportar CSV</button>
  <button class="pl-btn pl-btn-ghost">Cancelar</button>
  <button class="pl-btn pl-btn-danger"><svg class="pl-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg>Remover credencial</button>
  <button class="pl-btn pl-btn-danger-soft">Cancelar cadastro</button>
</div>
<div class="pl-row">
  <button class="pl-btn pl-btn-primary pl-btn-lg"><svg class="pl-ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 7.6-1.7"/></svg>Iniciar cadastro na fechadura</button>
  <button class="pl-btn pl-btn-primary" aria-disabled="true"><span class="pl-spinner"></span>Aguardando fechadura…</button>
  <button class="pl-btn pl-btn-sm"><svg class="pl-ico sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18l-7 8v6l-4 2v-8z"/></svg>Filtrar</button>
  <button class="pl-btn pl-btn-ghost pl-btn-icon pl-btn-sm" aria-label="Mais ações"><svg class="pl-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button>
</div>
</div>
</body>
</html>
