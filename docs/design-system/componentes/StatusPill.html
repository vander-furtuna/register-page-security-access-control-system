<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>StatusPill — PET Lock</title><link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../petlock.css"><style></style></head>
<body>
<div class="pl-demo col" style="gap:14px">
<div class="pl-row">
  <span class="pl-pill online live"><span class="dot"></span>Online</span>
  <span class="pl-pill offline"><span class="dot"></span>Offline · operando localmente</span>
  <span class="pl-pill master live"><span class="dot"></span>Modo mestre</span>
  <span class="pl-pill neutral"><span class="dot"></span>Em espera</span>
</div>
<div class="pl-row">
  <span class="pl-pill allowed"><span class="dot"></span>Liberado</span>
  <span class="pl-pill denied"><span class="dot"></span>Negado</span>
  <span class="pl-pill pending"><span class="dot"></span>Pendente de sincronização</span>
</div>
</div>
</body>
</html>
