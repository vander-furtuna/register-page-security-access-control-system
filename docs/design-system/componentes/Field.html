<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>Field — PET Lock</title><link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../petlock.css"><style></style></head>
<body>
<div class="pl-demo" style="display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start">
<div class="pl-field"><label class="pl-label" for="n">Nome completo<span class="req">*</span></label><input id="n" class="pl-input" value="Maria Clara Sousa"><span class="pl-help">Aparece no LCD da fechadura (até 16 caracteres).</span></div>
<div class="pl-field is-error"><label class="pl-label" for="e">E-mail institucional<span class="req">*</span></label><input id="e" class="pl-input" value="mariaclara@gmail" aria-invalid="true"><span class="pl-help">Use um e-mail @alu.ufc.br ou @ufc.br.</span></div>
<div class="pl-field"><label class="pl-label" for="s">Buscar</label><div class="pl-input-wrap"><svg class="pl-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="s" class="pl-input" placeholder="Nome, e-mail, UID do cartão ou ID da digital"></div></div>
<div class="pl-field"><label class="pl-label" for="r">Vínculo</label><select id="r" class="pl-input"><option>Petiano(a)</option><option>Tutor(a)</option><option>Visitante</option></select></div>
</div>
</body>
</html>
